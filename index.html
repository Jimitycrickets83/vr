<body>
<a-scene>
    <a-entity environment="preset:  forest; dressingAmount: 250; skyColor:#0A0A0A;"></a-entity>

    <a-box id="wall1" position="0 1.473 4.907" scale="10 3 0.2" src="images/chicken.jpg"></a-box>

    <a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="white"src="images/sunriseforever-game-console-6603118.jpg" ></a-box>
    <!--Roof-->
    <a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"src="images/publicdomainpictures-grass-275986_1920.jpg"></a-cylinder>
    <a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"src="images/publicdomainpictures-grass-275986_1920.jpg"></a-cylinder>
